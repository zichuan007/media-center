services:
  # ===================== AList - 云盘聚合 =====================
  alist:
    image: xhofe/alist:latest
    container_name: media-alist
    restart: always
    ports:
      - "5244:5244"
    volumes:
      - G:/docker-data/alist:/opt/alist/data
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
      - TZ=Asia/Shanghai
    networks:
      - media-net

  # ===================== Jellyfin - 媒体服务器 =====================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: media-jellyfin
    restart: always
    ports:
      - "8096:8096"
    volumes:
      - G:/docker-data/jellyfin/config:/config
      - G:/docker-data/jellyfin/cache:/cache
      - E:/:/media/local:ro
      - G:/docker-data/moviepilot/media:/media/organized:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - alist
    networks:
      - media-net

  # ===================== MoviePilot - 影视自动化管理 =====================
  moviepilot:
    image: jxxghp/moviepilot:latest
    container_name: media-moviepilot
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - G:/docker-data/moviepilot/config:/config
      - G:/docker-data/moviepilot/core:/moviepilot/.cache/ms-playwright
      - E:/:/download
      - G:/docker-data/moviepilot/media:/media
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
      - UMASK=022
      # 超级管理员账号
      - SUPERUSER=admin
      # 首次启动会提示设置密码
      # API Token，用于外部调用
      - API_TOKEN=media-center-token
      # TMDB API Key（需要自行申请: https://www.themoviedb.org/settings/api）
      - TMDB_API_DOMAIN=api.tmdb.org
      # 媒体库目录映射
      - DOWNLOAD_PATH=/download
      - LIBRARY_PATH=/media
      # 分类策略：电影/电视剧自动归类
      - LIBRARY_CATEGORY=true
      # 转移方式：hardlink（硬链接，不占额外空间）
      - TRANSFER_TYPE=link
    depends_on:
      - jellyfin
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
